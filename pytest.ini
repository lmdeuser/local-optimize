[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests requiring active GPU RAG server or PostgreSQL
    network: Tests requiring network access
    postgres: Tests requiring PostgreSQL connection
    systemd: Isolated tests for systemd integration (never touches user systemd)
    mcp_client: Tests requiring MCP client config
    cursor: Tests specifically for Cursor integration

norecursedirs =
    .venv
    venv
    env
    __pycache__
    .pytest_cache
    node_modules
    brain
    logs
    artifacts
    backup
    backups
    scripts
    refactored-agent-skills
