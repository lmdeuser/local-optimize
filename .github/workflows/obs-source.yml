name: Build OBS source assets in GitHub

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Debian source assets
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import tarfile
          import tempfile

          first_line = Path("debian/changelog").read_text().splitlines()[0]
          match = re.match(r"^(\S+) \((\S+)\)", first_line)
          package, version = match.groups()
          upstream = version.rsplit("-", 1)[0]
          output = Path("dist")
          output.mkdir()
          orig = output / f"{package}_{upstream}.orig.tar.gz"
          debian_tar = output / f"{package}_{version}.debian.tar.xz"

          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary) / f"{package}-{upstream}"
              root.mkdir()
              paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
              for raw in paths:
                  if not raw:
                      continue
                  relative = Path(os.fsdecode(raw))
                  if relative.parts[0] in {".github", "artifacts", "debian", "models"}:
                      continue
                  source = Path(relative)
                  destination = root / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  if source.is_symlink():
                      destination.symlink_to(os.readlink(source))
                  else:
                      shutil.copy2(source, destination)
              with tarfile.open(orig, "w:gz") as archive:
                  archive.add(root, arcname=root.name)

          with tarfile.open(debian_tar, "w:xz") as archive:
              archive.add("debian", arcname="debian")

          def digest(path, algorithm):
              return hashlib.new(algorithm, path.read_bytes()).hexdigest()

          assets = {
              "orig": orig,
              "debian": debian_tar,
          }
          section = ""
          result = []
          for line in Path("obs/base.dsc").read_text().splitlines():
              if line and not line[0].isspace():
                  section = line.split(":", 1)[0]
              if line.startswith("Version:"):
                  line = f"Version: {version}"
              elif line.startswith(" "):
                  old_name = line.rsplit(" ", 1)[-1]
                  kind = None
                  if old_name == f"{package}_{upstream}.orig.tar.gz":
                      kind = "orig"
                  elif old_name.startswith(f"{package}_") and old_name.endswith(".debian.tar.xz"):
                      kind = "debian"
                  if kind is not None:
                      asset = assets[kind]
                      algorithm = {"Files": "md5", "Checksums-Sha1": "sha1", "Checksums-Sha256": "sha256"}[section]
                      line = f" {digest(asset, algorithm)} {asset.stat().st_size} {asset.name}"
              result.append(line)
          dsc = output / f"{package}_{version}.dsc"
          dsc.write_text("\n".join(result) + "\n")
          print(f"Built cloud source assets for {package} {version}")
          PY

      - name: Publish source assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="obs-source-$(python3 -c 'import re; print(re.match(r"^\S+ \((\S+)\)", open("debian/changelog").readline()).group(1))')"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "OBS source ${tag#obs-source-}" \
              --notes "Cloud-generated Debian source assets for OBS. Runtime components remain pinned in OBS."
          fi
          gh release view "$tag" --json url --jq .url
